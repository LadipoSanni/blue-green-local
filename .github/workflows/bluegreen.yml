name: Blue-Green Deployment CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  IMAGE_NAME: ladipo/bluegreen

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Build and Push Blue Image
      run: |
        docker build -t $IMAGE_NAME:blue -f Dockerfile .
        docker tag $IMAGE_NAME:blue $IMAGE_NAME:latest-blue
        docker push $IMAGE_NAME:blue
        docker push $IMAGE_NAME:latest-blue

    - name: Build and Push Green Image
      run: |
        docker build -t $IMAGE_NAME:green -f Dockerfile .
        docker tag $IMAGE_NAME:green $IMAGE_NAME:latest-green
        docker push $IMAGE_NAME:green
        docker push $IMAGE_NAME:latest-green

    - name: Run Health Test on Blue and Green
      run: |
        docker run -d --rm --name test-blue -p 5001:5000 $IMAGE_NAME:blue
        docker run -d --rm --name test-green -p 5002:5000 $IMAGE_NAME:green
        sleep 5
        curl -f http://localhost:5001/health
        curl -f http://localhost:5002/health
        docker stop test-blue test-green

    - name: Version Tagging (optional)
      run: |
        GIT_TAG="v1.0.${{ github.run_number }}"
        echo "Tagging as $GIT_TAG"
        git tag $GIT_TAG || true
        git push origin $GIT_TAG || true


