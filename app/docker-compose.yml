version: '3.8'

services:
  blue:
    image: ladipo/bluegreen:blue
    container_name: blue
    environment:
      - APP_VERSION=blue
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/appdb
    networks:
      - bluegreen
    depends_on:
      - postgres
    restart: unless-stopped

  green:
    image: ladipo/bluegreen:green
    container_name: green
    environment:
      - APP_VERSION=green
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/appdb
    networks:
      - bluegreen
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bluegreen
    restart: unless-stopped

  nginx:
    image: nginx
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - blue
      - green
    networks:
      - bluegreen
    restart: unless-stopped

networks:
  bluegreen:

volumes:
  pgdata:
